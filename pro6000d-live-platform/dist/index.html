<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>训练管理</title>
  <link rel="stylesheet" href="vendor/patternfly.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="production">
  <div id="login" hidden></div>
  <div id="app" hidden>
    <header class="native-toolbar" aria-label="训练服务状态">
      <span id="host-state">读取设备状态</span>
      <span id="connection" class="tag amber">正在连接</span>
      <span id="last-updated">尚未连接</span>
      <button id="notifications" class="icon-button" aria-label="训练通知">通知 <b id="notification-count" hidden>0</b></button>
      <span id="identity" hidden></span><button id="logout" hidden>退出</button>
    </header>
    <nav class="native-tabs" aria-label="训练管理页面">
      <button data-page="training" class="navitem active">任务队列</button>
      <button data-page="metrics" class="navitem">GPU 监控</button>
      <button data-page="accounts" class="navitem">用户与额度</button>
      <button data-page="applications" class="navitem" id="applications-nav">我的申请</button>
      <button data-page="rules" class="navitem" hidden>调度规则</button>
    </nav>
    <div class="shell native-shell">
      <main id="main" class="content" aria-live="polite"><div class="empty">正在读取训练平台…</div></main>
    </div>
  </div>
  <div id="overlay"></div>
  <script src="app.js"></script>
</body>
</html>
