# Install only with the reviewed paired monthly release.
[Unit]
Requires=slurmd.service
BindsTo=slurmd.service
After=slurmd.service
PartOf=slurmd.service

[Service]
User=root
RuntimeDirectory=
ExecStartPre=/usr/bin/install -d -o slurm -g slurm -m 0755 /run/slurmctld
ExecStart=
ExecStart=/usr/local/libexec/pro6000d-quota-controller
